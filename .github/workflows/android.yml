name: Android CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Debug Kotlin (verbose)
        run: gradle :app:compileDebugKotlin --stacktrace --info --no-daemon
      - name: Compile Release Kotlin (verbose)
        run: gradle :app:compileReleaseKotlin --stacktrace --info --no-daemon
      - name: Unit tests (verbose)
        run: gradle test --stacktrace --info --no-daemon
      - name: Assemble Debug (verbose)
        run: gradle assembleDebug --stacktrace --info --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
